name: 🐳 Build & Push Felis Backend Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - staging
    paths-ignore:
      - .vscode
      - deploy

  pull_request:
    types: [labeled]
    paths-ignore:
      - .vscode
      - deploy

env:
  REPO_NAME: minswap/felis

jobs:
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: minswap
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Build Tag
        run: |
          REF_NAME="${{ github.ref_name }}"
          IMAGE_TAG="backend-$(echo "$REF_NAME" | tr '/' '-')-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        if: (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'staging' || contains(github.event.pull_request.labels.*.name, 'ci/build-be'))
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: |
            type=registry,ref=${{ env.REPO_NAME }}:cache-felis-backend
          cache-to: |
            type=registry,ref=${{ env.REPO_NAME }}:cache-felis-backend,mode=max

      - name: ✅ Notify on Success
        if: (always() && success()) && (github.ref_name == 'main' || github.ref_name == 'staging' || contains(github.event.pull_request.labels.*.name, 'ci/build-be'))
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "attachments": [
                {
                  "title": "${{ env.REPO_NAME }} ready to deploy",
                  "text": "Branch: `${{ github.ref_name }}`\nService: `long-short-backend`\nTag: `${{ env.IMAGE_TAG }}`",
                  "color": "good"
                }
              ]
            }' \
            "${{ secrets.SLACK_WEBHOOK_DEPLOYMENT }}"

      - name: ❌ Notify on Failure
        if: (always() && failure()) && (github.ref_name == 'main' || github.ref_name == 'staging' || contains(github.event.pull_request.labels.*.name, 'ci/build-be'))
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "attachments": [
                {
                  "title": "${{ env.REPO_NAME }} build failed",
                  "text": "Branch: `${{ github.ref_name }}`\nService: `long-short-backend`\nTag: `${{ env.IMAGE_TAG }}`\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Details>",
                  "color": "#FF0000"
                }
              ]
            }' \
            "${{ secrets.SLACK_WEBHOOK_DEPLOYMENT }}"
