  actionScriptHash: String!
}

type Market {
  id: String!
  displayName: String!
  symbol: String!

  """
  The asset eligible for use as collateral in the market
  """
  collaterals: [Collateral!]!

  """
  The asset used as collateral in the market
  """
  collateralInMarkets: [Market!]!
  asset: Asset!
  receiptAsset: Asset!

  """
  The total amount of supply in the market
  """
  supply(input: InCurrencyInput): Float!

  """
  The total amount of borrow in the market
  """
  borrow(input: InCurrencyInput): Float!

  """
  The total liquidity in the market
  """
  liquidity(input: InCurrencyInput): Float!
  supplyAPY: Float!
  borrowAPY: Float!
  lqSupplyAPY: Float!

  """
  Market utilization in percentage
  """
  utilization: Float!

  """
  Exchange rate between the qToken and the asset
  """
  exchangeRate: Float!

  """
  The market parameters
  """
  parameters: MarketParameters!

  """
  Boolean indicating if the market is batching
  """
  batching: Boolean!
  batchExpired: Boolean!

  """
  Boolean indiciating if the market is paused due to an epoch transition
  """
  batchEpochPause: Boolean!

  """
  The timestamp of the most recent batch
  """
  lastBatch: String!
  frozen: Boolean!

  """
  If this field is true, the market is private and cannot be accessed by users
  """
  private: Boolean!
  delisting: Boolean!

  """
  Loan origination fee percentage charged when taking out a loan from this market (decimilal representation, e.g., 1% = 0.01)
  """
  loanOriginationFeePercentage: Float!

  """
  The market is considered Prime when it's a direct lending
  """
  prime: Boolean!

  """
  Array of supply/borrow APY based on utilization rate (0-100%), incremented 1% at a time
  Useful for plotting the APY curve
  """
  utilizationApy: UtilizationApy!
  registry: MarketRegistry!

  """
  The timestamp of the last update update
  """
  updatedAt: String!
}

type MarketPagination {
  page: Int!
  perPage: Int!
  pagesCount: Int!
  totalCount: Int!
  results: [Market!]!
}

input MarketInput {
  id: String!
}

input MarketsInput {
  ids: [String!]
  page: Int = 0
  perPage: Int = 20
  sorts: [MarketSort!]
  filters: [MarketFilter!]
  search: String
}

type Collateral {
  id: String!
  displayName: String!
  symbol: String!
  market: Market
  asset: Asset!
  name: String!
  currencySymbol: String
}

enum AssetSort {
  ID
  ID_DESC
}

enum AssetFilter {
  STABLECOIN
  CNT
  BRIDGED
}

input AssetInput {
  id: String!
}

input AssetsInput {
  ids: [String]
  page: Int = 0
  perPage: Int = 20
  sorts: [AssetSort!]
  filters: [AssetFilter!]
  search: String
}

"""
Information about the asset
"""
type AssetExtra {
  bridge: Bridge
  maxSupply: Float
  totalSupply: Float
  circulatingSupply: Float
  discord: String
  twitter: String
  facebook: String
  website: String
  whitepaper: String
  github: String
  reddit: String
  medium: String
  telegram: String
  coingecko: String
  explorer: String
}

type Bridge {
  name: String!
  url: String!
}

type Hardcap {
  low: Float
  high: Float
}

type Asset {
  id: String!
  name: String!
  symbol: String!
  displayName: String!
  decimals: Int!

  """
  The PolicyId of the asset
  """
  currencySymbol: String!
  policyId: String!
  hexName: String!

  """
  Path to access the asset logo in the API
  """
  logo: String
  price(input: InCurrencyInput): Float!
  priceUpdatedAt: String!

  """
  Price boundaries beyond which the asset's oracle price cannot move
  """
  hardcap: Hardcap
  markets: [Market!]!
  extra: AssetExtra
}

type AssetPagination {
  page: Int!
  perPage: Int!
  pagesCount: Int!
  totalCount: Int!
  results: [Asset!]!
}
