  """
  walletFee: Float!

  """
  The maximum amount that can be withdrawn due to the borrow cap
  """
  withdrawCap: Float!
}

type netApyCalculation {
  """
  The net APY represents the effective annual yield after considering both supply and borrow rates
  """
  netApy: Float!

  """
  The net APY including LQ rewards
  """
  netApyLqRewards: Float!

  """
  The borrow APY is the rate charged on borrowed assets.
  """
  borrowApy: Float!

  """
  The total amount of assets borrowed across all positions
  """
  totalBorrow: Float!

  """
  The supply APY is the rate earned on supplied assets.
  """
  supplyApy: Float!

  """
  The total amount of assets supplied
  """
  totalSupply: Float!
}

