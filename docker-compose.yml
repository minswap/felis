x-base-backend: &base-backend
  build:
    context: .
    dockerfile: Dockerfile.backend
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://postgres:JBNGlQ9wNFLlYWc2mG@postgres:5432/margin
    REDIS_URL: redis://default:7obaQyYSDDLDk3ECYA@redis:6379
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:9999/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  # Long-Short Backend API Service
  # long-short-backend:
  #   <<: *base-backend
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend
  #     args:
  #       APP_NAME: long-short-backend
  #   ports:
  #     - "127.0.0.1:9999:9999"
  #   environment:
  #     DATABASE_URL: postgres://postgres:JBNGlQ9wNFLlYWc2mG@postgres:5432/margin
  #     REDIS_URL: redis://default:7obaQyYSDDLDk3ECYA@redis:6379
  #     API_PORT: 9999
  #     API_HOST: 0.0.0.0
  #   command: ["pnpm", "--filter=long-short-backend", "start"]

  # web:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   network_mode: host
  #   environment:
  #     NODE_ENV: production
  #     NEXT_PUBLIC_NETWORK_ENV: TESTNET_PREVIEW
  #     PORT: 3002
  #   expose:
  #     - "3002"
  #   restart: unless-stopped

  redis:
    image: redis:8
    restart: always
    command: --requirepass 7obaQyYSDDLDk3ECYA
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "7obaQyYSDDLDk3ECYA", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: JBNGlQ9wNFLlYWc2mG
      POSTGRES_DB: margin
    command: ["-c", "max_connections=50"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: {}
  redis-data: {}
